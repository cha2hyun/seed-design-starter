engineStrict: true
autoInstallPeers: true
strictPeerDependencies: false
# Corepack and bootstrap enforce packageManager; keep GitHub's dependency graph on the project lockfile.
pmOnFail: ignore

allowBuilds:
  esbuild: true
  unrs-resolver: false

overrides:
  # GHSA-g3hv-75wg-m249; consumers use APIs retained by v11 (see patches/README.md).
  minimatch@9.0.9: 11.0.1
  minimatch@10.2.6: 11.0.1
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
