name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Identical to local `pnpm verify` / pre-push — keep the step list in sync with package.json.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint architecture
        run: pnpm lint:fsd

      - name: Check formatting
        run: pnpm format:check

      - name: Check SEED token catalog is current
        run: pnpm seed:check

      - name: Check config/brand.config.json is applied
        run: pnpm brand:check

      - name: Check SEED snippet compatibility
        run: pnpm seed:compat

      - name: Verify the design system lock-in still holds
        run: pnpm verify:lockin

      - name: Build
        run: pnpm build
