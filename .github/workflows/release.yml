name: Release

# After a release PR merges into main, publish the SemVer tag and GitHub Release.
# Version source of truth: package.json (see CONTRIBUTING.md § 릴리스).

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release contract
        run: node scripts/verify-release.mjs

      - name: Read package version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::package.json version \"$VERSION\" is not a valid SemVer string."
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG notes for this version
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          awk -v ver="$VERSION" '
            BEGIN { grabbing = 0 }
            $0 ~ "^## \\[" ver "\\]" { grabbing = 1; next }
            grabbing && $0 ~ /^## \[/ { exit }
            grabbing { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file "$NOTES_FILE" \
            --target "$RELEASE_SHA"
